<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Journal — Offline</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background-color: #f5f5f5;
        color: #212121;
      }

      .container {
        text-align: center;
        padding: 32px 24px;
        max-width: 400px;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: #6200ee;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }

      .icon svg {
        width: 36px;
        height: 36px;
        fill: #ffffff;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #212121;
      }

      p {
        font-size: 15px;
        line-height: 1.6;
        color: #757575;
        margin-bottom: 28px;
      }

      button {
        background-color: #6200ee;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 0.4px;
      }

      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95A5.469 5.469 0 0 1 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11A2.98 2.98 0 0 1 22 15c0 1.65-1.35 3-3 3z"
          />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        Check your internet connection and try again. Your cached data may still
        be available once you reconnect.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
